# Render deployment configuration
# This file tells Render how to deploy your application

services:
  # Backend API Service
  - type: web
    name: cyberguard-backend
    runtime: node
    region: oregon
    rootDir: BACKEND
    buildCommand: npm install
    startCommand: node server-sqlite.js
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://cyberguard-frontend.onrender.com
      - key: NODE_ENV
        value: production
    disk:
      name: database
      mountPath: /opt/render/project/src/BACKEND
      sizeGB: 1
    healthCheckPath: /api/health
    autoDeploy: true

  # Frontend Static Site (using web type with http-server)
  - type: web
    name: cyberguard-frontend
    runtime: node
    region: oregon
    rootDir: FRONTEND
    buildCommand: npm install
    startCommand: npx http-server -p 8080
    envVars:
      - key: PORT
        value: 8080
    autoDeploy: true
