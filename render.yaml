# Render deployment configuration for Backend API only
# Frontend is deployed on Netlify

services:
  # Backend API Service
  - type: web
    name: cyberguard-backend
    runtime: node
    region: oregon
    rootDir: BACKEND
    buildCommand: npm install
    startCommand: node server-sqlite.js
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://your-netlify-site.netlify.app
      - key: NODE_ENV
        value: production
    disk:
      name: database
      mountPath: /opt/render/project/src/BACKEND
      sizeGB: 1
    healthCheckPath: /api/health
    autoDeploy: true
